include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

verify:
  image: oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4
  stage: test
  script:
    - sh bin/ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
