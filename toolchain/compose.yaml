name: kinetix-backoffice-toolchain

services:
  toolchain:
    image: oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4
    working_dir: /workspace
    environment:
      BUN_INSTALL_CACHE_DIR: /bun-cache
      DO_NOT_TRACK: "1"
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
      - bun_cache:/bun-cache

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [e2e]
    working_dir: /workspace
    ipc: host
    networks: [default, lab]
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

networks:
  lab:
    name: kinetix
    external: true

volumes:
  node_modules:
  bun_cache:
