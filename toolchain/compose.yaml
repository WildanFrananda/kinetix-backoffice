name: kinetix-backoffice-toolchain

services:
  toolchain:
    image: oven/bun:1.4.5-slim@sha256:b780593f3e10918cbdaec3d5a08d52224b9198069a65eb47812085c2ec007643
    working_dir: /workspace
    environment:
      BUN_INSTALL_CACHE_DIR: /bun-cache
      DO_NOT_TRACK: "1"
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
      - bun_cache:/bun-cache

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    profiles: [e2e]
    working_dir: /workspace
    ipc: host
    networks: [default, lab]
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

networks:
  lab:
    name: kinetix
    external: true

volumes:
  node_modules:
  bun_cache:
