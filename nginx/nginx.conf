worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript image/svg+xml;
  server_tokens off;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$http_x_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_seconds":$request_time,'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ /\. {
      return 404;
    }

    location /bff/ {
      include /etc/nginx/kinetix/headers.conf;
      default_type application/json;
      return 404 '{"error":"NOT_FOUND","message":"/bff/ belongs to the edge, not to the backoffice app."}';
    }

    location /assets/ {
      include /etc/nginx/kinetix/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/kinetix/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
